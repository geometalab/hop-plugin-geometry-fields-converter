image: maven:latest

stages:
  - build
  - test

before_script:
  - mkdir -p target

cache:
  paths:
    - target/

build:
  stage: build
  script:
    - mvn clean package
  artifacts:
    paths:
      - target/*.jar

unit_tests:
  stage: test
  script:
    - mvn test

integration_tests:
  stage: test
  image: 
    name: apache/hop:latest
    entrypoint: [""]
  variables:
    HOP_LOG_LEVEL: Basic
    HOP_PROJECT_FOLDER: "${CI_PROJECT_DIR}/samples"
    HOP_PROJECT_NAME: samples
    HOP_FILE_PATH: "transforms/switch-case-basic.hpl"
    HOP_RUN_CONFIG: local
  script:
    - /opt/hop/hop-run.sh -f="${HOP_FILE_PATH}" -j="${HOP_PROJECT_NAME}" -r="${HOP_RUN_CONFIG}" -l="${HOP_LOG_LEVEL}"
