image: maven:latest

stages:
  - build
  - test
  - release

before_script:
  - mkdir -p target

cache:
  paths:
    - target/

build:
  stage: build
  script:
    - mvn clean package

unit_tests:
  stage: test
  script:
    - mvn test

integration_tests:
  stage: test
  script:
    - echo "integration tests"

release:
  stage: release
#  only:
#    - main
  needs: ["build", "unit_tests", "integration_tests"]
  script:
    - |
      glab release create "$CI_COMMIT_TAG" \
      --name "Release ${VERSION}" \
      --notes "TODO: Release notes" \
      target/ \
      --use-package-registry