image: maven:latest

include:
  - template: Jobs/Code-Quality.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

stages:
  - build
  - test

before_script:
  - mkdir -p target

cache:
  paths:
    - target/

build:
  stage: build
  script:
    - mvn clean package
  artifacts:
    paths:
      - target/*.jar

unit_tests:
  stage: test
  script:
    - mvn test
  artifacts:
    paths:
      - target/site/jacoco
    reports:
      cobertura: target/site/jacoco/jacoco.xml

integration_tests:
  stage: test
  script:
    - mvn integration-test