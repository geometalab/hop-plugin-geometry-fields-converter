image: maven:latest

stages:
  - build
  - test
  - release

before_script:
  - mkdir -p target

cache:
  paths:
    - target/

build:
  stage: build
  script:
    - mvn clean package
  artifacts:
    paths:
      - target/*.jar

unit_tests:
  stage: test
  script:
    - mvn test

integration_tests:
  stage: test
  script:
    - echo "integration tests"

release:
  stage: release
#  only:
#    - main
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: ["build", "unit_tests", "integration_tests"]
  dependencies:
    - build
  before_script:
    - mkdir -p release
  script:
    - cp target/csv-validator-1.0.0.jar release/
    - cp version.xml release/
#    - |
#      glab release create "$CI_COMMIT_TAG" \
#     --name "Release ${CI_COMMIT_TAG}" \
#     --notes "Release notes" \
#     release/* \
#     --repo "$CI_PROJECT_PATH" \
#     --host "$CI_SERVER_HOST" \
#     --use-package-registry
  release:
    tag_name: $CI_COMMIT_TAG
    name: 'Release $CI_COMMIT_TAG'
    description: 'Release created using the CLI.'