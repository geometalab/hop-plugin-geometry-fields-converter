image: maven:latest

include:
  - template: Jobs/Code-Quality.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

stages:
  - build
  - test
  - release

before_script:
  - mkdir -p target

cache:
  paths:
    - target/

check_formatting:
  stage: build
  image: maven:3-openjdk-11
  script:
    - mvn spotless:check

build:
  stage: build
  script:
    - mvn clean package
    - mv version.xml target/version.xml
  artifacts:
    paths:
      - target/*.jar
      - target/version.xml
      - target/lib/

unit_tests:
  stage: test
  script:
    - mvn test

integration_tests:
  stage: test
  image:
    name: apache/hop:latest
    entrypoint: [ "" ]
  script:
    - mkdir -p /files
    - mkdir -p /opt/hop/plugins/transforms/geometryfieldsconverter
    - cp -r integration_test/* /files/
    - cp -r target/* /opt/hop/plugins/transforms/geometryfieldsconverter/
    - /opt/hop/hop-run.sh -r local -f /files/pipeline.hpl

prepare_release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apt-get update && apt-get install -y zip
    - mvn -B package
    - VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
    - ZIP_NAME="geometry-fields-converter-$VERSION.zip"
    - cd target
    - zip -r "../$ZIP_NAME" version.xml lib hop-transform-geometryfieldsconverter-$VERSION.jar
  artifacts:
    paths:
      - "*.zip"
    expire_in: never