image: maven:latest

stages:
  - build
  - test

before_script:
  - mkdir -p target

cache:
  paths:
    - target/

#build:
#  stage: build
#  script:
#    - mvn clean package
#  artifacts:
#    paths:
#      - target/*.jar
#
#unit_tests:
#  stage: test
#  script:
#    - mvn test

integration_tests:
  stage: test
  image: 
    name: apache/hop:latest
    entrypoint: [""]
  variables:
      HOP_LOG_LEVEL: Basic
      HOP_FILE_PATH: "${CI_PROJECT_DIR}resources/switch-case-basic.hpl"
      HOP_PROJECT_FOLDER: "${CI_PROJECT_DIR}"
      HOP_PROJECT_NAME: samples
      HOP_RUN_CONFIG: local
  script:
    - /opt/hop/hop-run.sh --file="${HOP_FILE_PATH}" --project="${HOP_PROJECT_NAME}" --runconfig="${HOP_RUN_CONFIG}" --level="${HOP_LOG_LEVEL}"

