image: maven:latest

stages:
  - build
  - test

before_script:
  - mkdir -p target

cache:
  paths:
    - target/

build:
  stage: build
  script:
    - mvn clean package
  artifacts:
    paths:
      - target/*.jar

unit_tests:
  stage: test
  script:
    - mvn test

integration_tests:
  stage: test
  image: 
    name: apache/hop:latest
    entrypoint: [""]
  variables:
    HOP_LOG_LEVEL: Basic
    HOP_PROJECT_FOLDER: "${CI_PROJECT_DIR}/integration-tests"
    HOP_PROJECT_NAME: sample
    PIPELINE_NAME: integration-pipeline
    HOP_RUN_CONFIG: local
  script:
    - mkdir -p "${HOP_PROJECT_FOLDER}/project"
    - /opt/hop/hop-run.sh -p create-project --name "${HOP_PROJECT_NAME}" --folder "${HOP_PROJECT_FOLDER}"
    - /opt/hop/hop-run.sh -p create-pipeline --project "${HOP_PROJECT_NAME}" --name "${PIPELINE_NAME}" --folder "${HOP_PROJECT_FOLDER}/pipelines"
    - /opt/hop/hop-run.sh -f "pipelines/${PIPELINE_NAME}.hpl" -j "${HOP_PROJECT_NAME}" -r "${HOP_RUN_CONFIG}" -l "${HOP_LOG_LEVEL}"