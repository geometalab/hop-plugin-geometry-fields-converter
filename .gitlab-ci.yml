image: maven:latest

stages:
  - build
  - test
  - release

before_script:
  - mkdir -p target

cache:
  paths:
    - target/

build:
  stage: build
  script:
    - mvn clean package
  artifacts:
    paths:
      - "target/"

unit_tests:
  stage: test
  script:
    - mvn test

integration_tests:
  stage: test
  script:
    - echo "integration tests"

release:
  stage: release
#  only:
#    - main
  needs: ["build", "unit_tests", "integration_tests"]
  dependencies:
    - build
  before_script:
    - mkdir -p release
  script:
    - mvn install -DtargetDir=$CI_PROJECT_DIR/build/target -DreleaseDir=$CI_PROJECT_DIR/release
    - |
      glab release create "$CI_COMMIT_TAG" \
      --name "Release ${VERSION}" \
      --notes "TODO: Release notes" \
      release/ \
      --use-package-registry
  artifacts:
    paths:
      - "release/"