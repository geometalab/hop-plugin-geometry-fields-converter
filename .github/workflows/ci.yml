name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - github_migration

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Spotless check
        run: mvn -B spotless:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check_formatting
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build package
        run: |
          mvn -B clean package
          cp version.xml target/version.xml

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-target
          path: |
            target/*.jar
            target/version.xml
            target/lib/**

  unit_test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: mvn -B test

  integration_test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: build
    if: ${{ false }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-target
          path: .

      - name: Run integration pipeline
        run: |
          docker run --rm --entrypoint /bin/sh \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            apache/hop:latest \
            -lc "mkdir -p /files /opt/hop/plugins/transforms/geometryfieldsconverter; cp -r integration_test/* /files/; cp -r target/* /opt/hop/plugins/transforms/geometryfieldsconverter/; /opt/hop/hop-run.sh -r local -f /files/pipeline.hpl"

  speed_test:
    name: Speed Test
    runs-on: ubuntu-latest
    needs: build
    if: ${{ false }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-target
          path: .

      - name: Run speed test pipeline
        run: |
          docker run --rm --entrypoint /bin/sh \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            apache/hop:latest \
            -lc "mkdir -p /files /opt/hop/plugins/transforms/geometryfieldsconverter; /opt/hop/hop-conf.sh -pc -p speed_test -ph /files; wget https://github.com/atolcd/hop-gis-plugins/releases/download/v1.4.0/gis-plugin-assemblies-1.4.0.zip -O gis.zip; unzip gis.zip -d /opt/hop/plugins/; cp -r speed_test/* /files/; cp -r target/* /opt/hop/plugins/transforms/geometryfieldsconverter/; /opt/hop/hop-run.sh -j speed_test -r local -f /files/speed_test.hpl; cp /files/metrics.json speed_test/metrics.json"

      - name: Upload speed test metrics
        uses: actions/upload-artifact@v4
        with:
          name: speed-test-metrics
          path: speed_test/metrics.json

  evaluate_performance:
    name: Evaluate Performance
    runs-on: ubuntu-latest
    needs: speed_test
    if: ${{ false }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download speed test metrics
        uses: actions/download-artifact@v4
        with:
          name: speed-test-metrics
          path: speed_test

      - name: Install evaluation tools
        run: sudo apt-get update && sudo apt-get install -y jq bc

      - name: Evaluate performance
        run: |
          cd speed_test
          bash evaluate_performance.sh
